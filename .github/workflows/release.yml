# PokéBonk desktop client (docs/DESKTOP.md in the game's repo). This repo (CharcherGit/pokebonk-app) holds the client's source, a copy
# of the game repo's desktop/ folder (`npm run sync:repo` there), and its downloads. A tag `v*` builds Windows, macOS and Linux on
# GitHub's machines and leaves everything in a DRAFT release of that tag: the installers plus latest*.yml and the .blockmap files the
# automatic updater reads (src/updater.ts). Publishing the draft is what makes the clients update. Also by hand (Actions → Release →
# Run workflow): the installers stay as the run's artifacts.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # No certificates: ad-hoc signature on the Mac (electron-builder.yml) and none on Windows.
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: pokebonk-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: PokéBonk ${{ github.ref_name }}
          files: dist/*
