# PokéBonk desktop client (docs/DESKTOP.md in the game's repo). This repo (CharcherGit/pokebonk-app) holds the client's source, a copy
# of the game repo's desktop/ folder (`npm run sync:repo` there), and its downloads. A tag `v*` builds Windows, macOS and Linux on
# GitHub's machines and leaves everything in a DRAFT release of that tag: the installers plus latest*.yml and the .blockmap files the
# automatic updater reads (src/updater.ts). Publishing the draft is what makes the clients update. Also by hand (Actions → Release →
# Run workflow): the installers stay as the run's artifacts.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            # ASCII bundle name: with «é» the helpers end up NFD and CFBundleName NFC, and the app crashes on launch (issue #5).
            target: --mac -c.productName=PokeBonk
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # No certificates: ad-hoc signature on the Mac (electron-builder.yml) and none on Windows.
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The DMG as players get it: the helpers must have exactly the bytes of CFBundleName, and the app must start and quit by itself.
      - name: Check the macOS app from the DMG
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(ls release/*.dmg | head -1)
          hdiutil attach "$dmg" -mountpoint /tmp/pb -nobrowse -readonly
          app=$(ls -d /tmp/pb/*.app | head -1)
          name=$(plutil -extract CFBundleName raw -o - "$app/Contents/Info.plist")
          exe=$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")
          ls "$app/Contents/Frameworks" | grep ' Helper' | sed 's/ Helper.*//' | sort -u > /tmp/helpers.txt
          echo "CFBundleName: $name"; cat /tmp/helpers.txt
          [ "$(cat /tmp/helpers.txt)" = "$name" ] || { echo "Helper names do not match CFBundleName"; exit 1; }
          curl -sS -o /dev/null -w "pokebonk.com from this runner: %{http_code} in %{time_total} s
" https://pokebonk.com/ || true
          "$app/Contents/MacOS/$exe" --selftest=/tmp/st --selftest-wait=6000 &
          pid=$!
          for i in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          # A crash on launch (issue #5) ends the process at once with an error: `wait` fails the step. Still running after 90 s means the app
          # started but the page did not load here: on the macos-26-arm64 image of 2026-11-23 Chromium's network service dies after ~75 s,
          # with 1.4.0's code as well (A/B run 45923054078) and with --use-mock-keychain, while players load the game from 1.4.0 on their Macs.
          if kill -0 $pid 2>/dev/null; then
            kill $pid
            echo "::warning::The app is running, but its self-test did not finish in 90 s (the page did not load on this runner)."
          else
            wait $pid
            cat /tmp/st/report.json
          fi
          hdiutil detach /tmp/pb
      # The Linux builds as players run them, on Ubuntu 24.04 (apparmor_restrict_unprivileged_userns = 1, like the players of issue #9): the
      # .deb installed with apt and run from /opt as a normal user, and the AppImage, must load the game and quit by themselves. On that
      # system the client starts itself again with --no-sandbox, so the check waits for the report file, not for the first process.
      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          echo "apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo none)"
          Xvfb :99 -screen 0 1280x720x24 & export DISPLAY=:99
          check() {
            local dir=$1; shift
            "$@" --selftest="$dir" --selftest-wait=6000 > "$dir.log" 2>&1 &
            for i in $(seq 1 120); do [ -f "$dir/report.json" ] && break; sleep 1; done
            [ -f "$dir/report.json" ] || { echo "Self-test did not finish: $*"; tail -40 "$dir.log"; exit 1; }
            sleep 2; cat "$dir/report.json"
            grep -q '"url": "https://pokebonk.com/"' "$dir/report.json" || { echo "The game did not load: $*"; exit 1; }
          }
          sudo apt-get install -y -qq ./release/*-amd64.deb > /dev/null
          check /tmp/st-deb "$(readlink -f /usr/bin/PokeBonk || ls /opt/*/PokeBonk | head -1)"
          img=$(ls release/*-x86_64.AppImage | head -1); chmod +x "$img"
          export APPIMAGE_EXTRACT_AND_RUN=1; check /tmp/st-appimage "$img"
      - uses: actions/upload-artifact@v4
        with:
          name: pokebonk-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: PokéBonk ${{ github.ref_name }}
          files: dist/*
